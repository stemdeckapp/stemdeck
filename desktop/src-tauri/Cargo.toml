[package]
name = "stemdeck"
# Placeholder — stamped from the git tag at build time (Woodpecker / make-app.sh). #169
version = "0.0.0"
description = "StemDeck desktop launcher"
authors = ["StemDeck contributors"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flate2 = "1"
libc = "0.2"
# Enumerating this machine's own interface addresses, so the generated
# certificate can name the IPs a phone will actually dial. std has no API for
# this and the platform calls differ three ways.
local-ip-address = "0.6"
# Generating StemDeck's own LAN certificate on the user's machine. A shipped
# certificate would ship its private key to every download, which is strictly
# worse than plain http because it looks secure. See src/certs.rs.
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
# Decoding the drag preview the UI renders for a lane. Already in the tree via
# reqwest; named here because dragout.rs uses it directly.
base64 = "0.22"
# Native drag-out of a rendered file to the OS (a DAW, Explorer, Finder).
# The crate tauri-plugin-drag wraps; taken directly because the plugin exposes
# start_drag only as a #[command], which would mean JavaScript naming the file
# path. See dragout.rs.
drag = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Binding a port without listening on it. std's TcpListener always listens, and
# a listener on 0.0.0.0 makes StemDeck.exe itself a server in the eyes of
# Windows Firewall, prompting the user. Reserving a port is not serving on it.
socket2 = "0.6"
tar = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
# Certificate validity dates. Already in the tree via rcgen; named here because
# certs.rs uses it directly.
time = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"

# Answering the webview's microphone and camera requests for StemDeck's own
# page (src/mediaperm.rs). All three are already in the tree through wry, at
# these versions; named here because mediaperm.rs calls them directly.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
# The backend's kill-on-close job object (src/backendjob.rs, #790). Already in
# the tree at this version; named here because backendjob.rs calls it directly.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Pinned exactly, with the feature wry 0.55.1 uses: wry requires =2.0.2.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "stemdeck"
# Placeholder — stamped from the git tag at build time (Woodpecker / make-app.sh). #169
version = "0.0.0"
description = "StemDeck desktop launcher"
authors = ["StemDeck contributors"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flate2 = "1"
libc = "0.2"
# Enumerating this machine's own interface addresses, so the generated
# certificate can name the IPs a phone will actually dial. std has no API for
# this and the platform calls differ three ways.
local-ip-address = "0.6"
# Generating StemDeck's own LAN certificate on the user's machine. A shipped
# certificate would ship its private key to every download, which is strictly
# worse than plain http because it looks secure. See src/certs.rs.
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Binding a port without listening on it. std's TcpListener always listens, and
# a listener on 0.0.0.0 makes StemDeck.exe itself a server in the eyes of
# Windows Firewall, prompting the user. Reserving a port is not serving on it.
socket2 = "0.6"
tar = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
# Certificate validity dates. Already in the tree via rcgen; named here because
# certs.rs uses it directly.
time = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

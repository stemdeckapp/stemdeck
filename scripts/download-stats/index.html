<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StemDeck Downloads</title>
<meta name="description" content="Total StemDeck downloads across all releases, recorded every 10 minutes.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* One column: a big total, then one line chart of that total over time. */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --fg: #16181d; --muted: #5d6472; --line: #dfe2e8; --grid: #e9ebf0;
  --accent: #e2561b; --accent-fill: rgba(226, 86, 27, 0.12); --good: #1a8a4a; --warn: #c48a07;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --panel: #171a20; --fg: #e9ebf0; --muted: #969eac; --line: #2a2f38; --grid: #20242c;
    --accent: #ff7a3d; --accent-fill: rgba(255, 122, 61, 0.14); --good: #4bc77f; --warn: #e3b13a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --panel: #171a20; --fg: #e9ebf0; --muted: #969eac; --line: #2a2f38; --grid: #20242c;
  --accent: #ff7a3d; --accent-fill: rgba(255, 122, 61, 0.14); --good: #4bc77f; --warn: #e3b13a; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font: 700 1.6rem/1.15 var(--font-display); margin: 0; letter-spacing: -0.01em; }
.status { font: 0.8rem var(--font-mono); color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
.dot.stale { background: var(--warn); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 16px; }
.top { display: flex; flex-wrap: wrap; gap: 12px 40px; align-items: flex-end; }
.label { font: 500 0.72rem var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.big { font: 700 3.4rem/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--accent); margin-top: 6px; }
.mid { font: 600 1.4rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; margin-top: 8px; }
.sub { font-size: 0.82rem; color: var(--muted); }
.box { position: relative; height: 380px; }
.note { font-size: 0.8rem; color: var(--muted); }
@media (max-width: 640px) { .box { height: 300px; } .big { font-size: 2.6rem; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>StemDeck Downloads</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="updated">Loading…</span> · one point every 10 min</div>
  </header>

  <section class="card" aria-label="Total downloads">
    <div class="top">
      <div>
        <div class="label">Total downloads, all releases</div>
        <div class="big" id="total">–</div>
        <div class="sub" id="releases">–</div>
      </div>
      <div>
        <div class="label">Since recording started</div>
        <div class="mid" id="since">–</div>
        <div class="sub" id="since-sub">&nbsp;</div>
      </div>
      <div>
        <div class="label">Last hour</div>
        <div class="mid" id="hour">–</div>
        <div class="sub">new downloads</div>
      </div>
    </div>
    <div class="box"><canvas id="chart" aria-label="Line chart of total downloads over time"></canvas></div>
    <div class="note" id="note"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(() => {
  const REFRESH_MS = 60 * 1000;   // re-read the data file; the recorder adds a point every 10 minutes
  const STALE_MS = 25 * 60 * 1000;
  const HOUR = 3600e3, DAY = 24 * HOUR;
  let chart = null;

  const $ = (id) => document.getElementById(id);
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmt = (n) => n.toLocaleString("en-US");
  const signed = (n) => (n > 0 ? "+" : "") + fmt(n);
  const when = (ms) => new Date(ms).toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

  // One point per snapshot: the sum over every release that existed at that
  // time. A snapshot that is missing a release published before it was taken
  // is incomplete, so it is skipped rather than drawn as a false dip.
  function series(data) {
    const published = new Map(Object.entries(data.releases).map(([tag, r]) => [tag, Date.parse(r.published_at)]));
    const out = [];
    for (const s of data.snapshots) {
      const t = Date.parse(s.t);
      let complete = true, sum = 0, n = 0;
      for (const [tag, pub] of published) {
        if (pub > t) continue;
        if (!(tag in s.d)) { complete = false; break; }
        sum += s.d[tag]; n++;
      }
      if (complete && n) out.push({ x: t, y: sum, n });
    }
    return out;
  }

  function atOrBefore(pts, t) {
    let found = null;
    for (const p of pts) { if (p.x <= t) found = p; else break; }
    return found;
  }

  function render(data) {
    const pts = series(data);
    if (!pts.length) { $("updated").textContent = "No data yet"; return; }
    const first = pts[0], last = pts[pts.length - 1];
    $("total").textContent = fmt(last.y);
    $("releases").textContent = `across ${last.n} releases`;
    $("since").textContent = pts.length > 1 ? signed(last.y - first.y) : "–";
    $("since-sub").textContent = `since ${when(first.x)}`;
    const hourAgo = atOrBefore(pts, last.x - HOUR);
    $("hour").textContent = hourAgo ? signed(last.y - hourAgo.y) : "–";
    const age = Date.now() - Date.parse(data.updated);
    $("updated").textContent = `Updated ${when(Date.parse(data.updated))}`;
    $("dot").classList.toggle("stale", age > STALE_MS);
    $("note").textContent = pts.length < 6
      ? "Recording just started, so the line is short. GitHub only reports current totals, so earlier history cannot be recovered. Counts include installers and app bundles, not checksum or metadata files."
      : "Counts include installers and app bundles, not checksum or metadata files.";

    const span = last.x - first.x;
    const accent = css("--accent"), muted = css("--muted"), grid = css("--grid"), line = css("--line"), panel = css("--panel"), fg = css("--fg");
    const short = Math.max(span, 30 * 60e3) < 2 * DAY;
    const dataset = {
      data: pts, borderColor: accent, backgroundColor: css("--accent-fill"), fill: true, borderWidth: 2.5, tension: 0,
      pointRadius: (c) => (c.dataIndex === pts.length - 1 ? 5 : pts.length < 40 ? 3 : 0), pointHoverRadius: 5, pointBackgroundColor: accent,
    };
    const options = {
      responsive: true, maintainAspectRatio: false, animation: false, parsing: false,
      interaction: { mode: "nearest", intersect: false, axis: "x" },
      scales: {
        x: {
          type: "linear", min: first.x, max: Math.max(last.x, first.x + 30 * 60e3),
          grid: { color: grid }, border: { color: line },
          ticks: { color: muted, maxTicksLimit: 7, font: { family: "JetBrains Mono", size: 11 },
            callback: (v) => short ? new Date(v).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" }) : new Date(v).toLocaleDateString("en-US", { month: "short", day: "numeric" }) },
        },
        y: {
          grace: "8%", grid: { color: grid }, border: { color: line },
          ticks: { color: muted, font: { family: "JetBrains Mono", size: 11 }, callback: (v) => fmt(Math.round(v)) },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: panel, titleColor: fg, bodyColor: fg, borderColor: line, borderWidth: 1, displayColors: false,
          titleFont: { family: "Inter", weight: "600" }, bodyFont: { family: "JetBrains Mono" },
          callbacks: { title: (items) => when(items[0].parsed.x), label: (i) => `${fmt(i.parsed.y)} downloads` },
        },
      },
    };
    if (chart) { chart.data.datasets = [dataset]; chart.options = options; chart.update(); }
    else chart = new Chart($("chart"), { type: "line", data: { datasets: [dataset] }, options });
  }

  async function refresh() {
    try {
      const r = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
    } catch {
      $("updated").textContent = "No data yet";
    }
  }

  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refresh);
  setInterval(refresh, REFRESH_MS);
  refresh();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StemDeck Downloads</title>
<meta name="description" content="Total downloads of every StemDeck release, refreshed every 10 minutes.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* One column: a heading with the grand total, then one bar per release, newest first. */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --fg: #16181d; --muted: #5d6472; --line: #dfe2e8;
  --bar: #4a86e8; --bar-pre: #a9c4f2; --accent: #e2561b; --good: #1a8a4a; --warn: #c48a07;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --panel: #171a20; --fg: #e9ebf0; --muted: #969eac; --line: #2a2f38;
    --bar: #6c9cff; --bar-pre: #3b5a96; --accent: #ff7a3d; --good: #4bc77f; --warn: #e3b13a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --panel: #171a20; --fg: #e9ebf0; --muted: #969eac; --line: #2a2f38;
  --bar: #6c9cff; --bar-pre: #3b5a96; --accent: #ff7a3d; --good: #4bc77f; --warn: #e3b13a; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
h1 { font: 700 1.6rem/1.15 var(--font-display); margin: 0; letter-spacing: -0.01em; }
.status { font: 0.8rem var(--font-mono); color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
.dot.stale { background: var(--warn); }
.total { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.total b { font: 700 2.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.total span { color: var(--muted); font-size: 0.9rem; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 16px; columns: 2 460px; column-gap: 40px; }
.row { display: grid; grid-template-columns: 8.2rem minmax(0, 1fr) 3.8rem; align-items: center; gap: 10px; padding: 2px 0; break-inside: avoid; border-bottom: 1px solid var(--line); }
.tag { font: 500 0.76rem var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); text-decoration: none; }
a.tag:hover { text-decoration: underline; }
.track { height: 11px; }
.fill { height: 100%; min-width: 2px; border-radius: 0 3px 3px 0; background: var(--bar); }
.row.pre .fill { background: var(--bar-pre); }
.row.latest .fill { background: var(--accent); }
.row.latest .tag, .row.latest .num { color: var(--accent); font-weight: 600; }
.num { font: 500 0.76rem var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.note { font-size: 0.8rem; color: var(--muted); }
@media (max-width: 480px) { .row { grid-template-columns: 6.6rem minmax(0, 1fr) 3.6rem; gap: 8px; } .tag { font-size: 0.78rem; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>StemDeck Downloads</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="updated">Loading…</span> · refreshed every 10 min</div>
  </header>
  <div class="total"><b id="total">–</b><span id="count">total downloads</span></div>
  <div class="card" id="rows" role="list" aria-label="Total downloads by release"></div>
  <div class="note">Total downloads per release, newest first. Counts include installers and app bundles, not checksum or metadata files. Lighter bars are alpha releases.</div>
</div>

<script>
(() => {
  const STALE_MS = 25 * 60 * 1000;
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n.toLocaleString("en-US");
  const when = (ms) => new Date(ms).toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

  function render(data) {
    const snap = data.snapshots[data.snapshots.length - 1];
    if (!snap) { $("updated").textContent = "No data yet"; return; }
    const tags = data.tracked.filter((t) => t in snap.d);   // newest first
    const max = Math.max(...tags.map((t) => snap.d[t]), 1);
    const total = tags.reduce((s, t) => s + snap.d[t], 0);
    $("total").textContent = fmt(total);
    $("count").textContent = `total downloads across ${tags.length} releases`;
    $("updated").textContent = `Updated ${when(Date.parse(data.updated))}`;
    $("dot").classList.toggle("stale", Date.now() - Date.parse(data.updated) > STALE_MS);

    const box = $("rows");
    box.replaceChildren(...tags.map((tag, i) => {
      const meta = data.releases[tag] || {};
      const row = document.createElement("div");
      row.className = "row" + (i === 0 ? " latest" : "") + (/-(alpha|beta|rc)/.test(tag) ? " pre" : "");
      row.setAttribute("role", "listitem");
      const a = document.createElement("a");
      a.className = "tag"; a.textContent = tag; a.href = meta.url || "#"; a.target = "_blank"; a.rel = "noopener";
      const track = document.createElement("div"); track.className = "track";
      const fill = document.createElement("div"); fill.className = "fill"; fill.style.width = (snap.d[tag] / max * 100) + "%";
      track.appendChild(fill);
      const num = document.createElement("div"); num.className = "num"; num.textContent = fmt(snap.d[tag]);
      row.append(a, track, num);
      return row;
    }));
  }

  async function refresh() {
    try {
      const r = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
    } catch { $("updated").textContent = "No data yet"; }
  }
  setInterval(refresh, 60 * 1000);
  refresh();
})();
</script>
</body>
</html>

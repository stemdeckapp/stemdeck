name: Download Stats

# Every 10 minutes, record the download count of the latest release and the
# 5 before it, and publish the stats page (scripts/download-stats/index.html)
# together with the recorded history (data.json) to the `download-stats`
# branch. GitHub Pages serves that branch; set it once under
# Settings -> Pages -> Build and deployment -> Deploy from a branch ->
# `download-stats` / (root).
#
# The branch holds a single commit that is replaced on every run, so the
# repository does not grow by 144 commits a day. The history lives inside
# data.json, which collect.py thins to hourly points after 14 days.
#
# GitHub may start scheduled runs a few minutes late under load. The page
# also polls the API itself every 10 minutes, so its newest point is live.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/download-stats/**
      - .github/workflows/download-stats.yml

permissions: {}

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # force-push the download-stats branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - name: Restore recorded history
        run: |
          mkdir -p site
          if git fetch --depth=1 origin download-stats 2>/dev/null; then
            git show FETCH_HEAD:data.json > site/data.json || true
          fi

      - name: Record snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/download-stats/collect.py site/data.json "${{ github.repository }}"

      - name: Publish page and data
        run: |
          cp scripts/download-stats/index.html site/index.html
          touch site/.nojekyll
          cd site
          git init -q -b download-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Download stats $(date -u +%Y-%m-%dT%H:%MZ)"
          # Reuse the token actions/checkout stored in the parent repo.
          auth="$(git -C .. config --get http.https://github.com/.extraheader)"
          git -c "http.https://github.com/.extraheader=$auth" push -q --force \
            "$(git -C .. config --get remote.origin.url)" download-stats:download-stats

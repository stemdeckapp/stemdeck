# GitHub Actions: lint + unit tests + security scans.
# Does not build or publish artifacts. Image scanning is done via
# trivy fs on the project tree (covers deps, secrets, and Dockerfile
# misconfig) so CI does not need a docker-in-docker setup.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

# No job writes to the repository, so the token gets nothing. Checkout of this
# public repository and the artifact upload work without it, as in the other
# workflows.
permissions: {}

env:
  UV_LINK_MODE: copy
  # Version is git-derived (hatch-vcs). CI's clone is shallow/tagless, which
  # makes setuptools_scm raise, so pin a placeholder for the build -- CI only
  # lints/tests and never publishes. #169
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # diffq (a mandatory transitive dependency of audio-separator, #275) has
      # no prebuilt wheel for Python 3.11+ on Linux -- its last release only
      # ever shipped cp310 wheels -- so uv sync must compile it from source.
      # Docker and the Linux desktop release build already install
      # build-essential for the same reason; this container didn't need it
      # before audio-separator existed.
      - run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check app/ tests/
      - run: uv run ruff format --check app/ tests/
      - run: bash -n run.sh
      # The retry wrapper the e2e installs depend on (#838). Here because this
      # job runs on every pull request, whatever it changes.
      - run: bash tests/ci/test_retry_sh.sh
      # The Docker entrypoint's ownership pass (#994). This container runs as
      # root, which the mixed-owner and symlink cases need, and sh here is
      # dash, the same shell as the image.
      - run: bash tests/ci/test_docker_reown_sh.sh

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # build-essential: see the matching comment in the lint job above.
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg build-essential
      - run: uv sync --frozen --all-extras
      - run: uv run pytest tests/ -q

  js-syntax:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: for f in static/js/*.js; do node --check "$f"; done
      - run: for f in tests/js/*.test.mjs; do node "$f"; done

  # Browser tests for static/js: the steps live in e2e.yml, shared with
  # e2e-full.yml. Runs the whole suite, and only for a pull request into main,
  # a push to main or a release. A pull request into any other base (such as
  # big-release) skips it (#1024): the full run on every push to big-release
  # and the nightly run (e2e-full.yml) catch a broken spec on the merge commit.
  # Checks show as "frontend-e2e / frontend-e2e (1)" to "(3)" on those events.
  frontend-e2e:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    # A new push to a pull request cancels that pull request's older e2e run.
    # Anything else gets a group of its own (the run id), so a push to main or
    # a release is never cancelled and never waits behind another run. This
    # does not help a runner GitHub never assigns: re-run that job, or
    # gh run cancel <id> then gh run rerun <id> --failed.
    concurrency:
      group: e2e-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/e2e.yml
    with:
      mode: full
      base-ref: ${{ github.base_ref }}

  # The Linux installer only ever runs on a user's machine, so nothing else
  # would catch a regression in it. Runs on a real Linux image rather than the
  # macOS bash used during development.
  linux-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: bash -n packaging/linux/install.sh
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils
      - run: shellcheck -S warning packaging/linux/install.sh
      - run: bash tests/linux/test_install_sh.sh

  sast-bandit:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: uv tool install bandit
      - run: uv tool run bandit -r app/ -ll  # fail on medium+ severity

  deps-audit:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: uv tool install pip-audit
      - run: uv pip compile pyproject.toml -o /tmp/requirements.txt
      # Ignored CVEs (review when upgrading torch or demucs):
      #
      # torch 2.6.0 -- pinned to <2.7 because torchaudio 2.7+ removed its
      # built-in audio writer and now requires torchcodec, which has ABI
      # issues that break demucs 4.0.1's torchaudio.save() path. All torch
      # CVEs below are in ops that StemDeck does not invoke; risk on a
      # local-only, single-user app is negligible. Re-evaluate once demucs
      # supports torch 2.7+ without torchcodec.
      #
      # torch PYSEC-2026-2286 (torch.load weights_only deserialization -> ACE,
      # HIGH; fix 2.10.0) -- the exploit needs an attacker-controlled .pth.
      # StemDeck never calls torch.load on untrusted input: demucs loads only its
      # official model weights from the trusted torch-hub source, and users
      # submit audio, not checkpoints. The same <2.7 pin blocks the 2.10.0 fix;
      # re-evaluate with the torch upgrade noted above.
      #
      # joblib PYSEC-2024-277 -- no fix version available as of 2026-05-21
      # (1.5.3 is latest). joblib is a transitive dep via demucs/librosa;
      # StemDeck does not directly invoke joblib serialization. Drop once
      # a patched release is available.
      - run: |
          uv tool run pip-audit -r /tmp/requirements.txt --strict \
            --ignore-vuln CVE-2025-2953 \
            --ignore-vuln CVE-2025-3730 \
            --ignore-vuln PYSEC-2025-189 \
            --ignore-vuln PYSEC-2025-190 \
            --ignore-vuln PYSEC-2025-192 \
            --ignore-vuln PYSEC-2025-193 \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2025-195 \
            --ignore-vuln PYSEC-2025-196 \
            --ignore-vuln PYSEC-2025-197 \
            --ignore-vuln PYSEC-2025-198 \
            --ignore-vuln PYSEC-2025-199 \
            --ignore-vuln PYSEC-2025-200 \
            --ignore-vuln PYSEC-2025-201 \
            --ignore-vuln PYSEC-2025-202 \
            --ignore-vuln PYSEC-2025-203 \
            --ignore-vuln PYSEC-2025-204 \
            --ignore-vuln PYSEC-2025-205 \
            --ignore-vuln PYSEC-2025-206 \
            --ignore-vuln PYSEC-2025-207 \
            --ignore-vuln PYSEC-2025-208 \
            --ignore-vuln PYSEC-2025-209 \
            --ignore-vuln PYSEC-2025-210 \
            --ignore-vuln PYSEC-2026-139 \
            --ignore-vuln PYSEC-2026-2286 \
            --ignore-vuln PYSEC-2024-277 \
            --ignore-vuln CVE-2025-2148 \
            --ignore-vuln CVE-2025-2149 \
            --ignore-vuln CVE-2025-2998 \
            --ignore-vuln CVE-2025-2999 \
            --ignore-vuln CVE-2025-3000 \
            --ignore-vuln CVE-2025-3001

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Installs Trivy from its GitHub release asset, checked against a pinned
      # sha256, instead of letting trivy-action call setup-trivy. setup-trivy's
      # install.sh downloads the binary from get.trivy.dev, so the scan failed
      # (curl exit 6) as soon as that hostname stopped resolving. Bump the
      # version and the sha256 together: the sha256 is the Linux-64bit line of
      # trivy_<version>_checksums.txt in the same release.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.70.0
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/trivy-bin/trivy" --version
      # Scans the source tree for: known CVEs in deps, leaked secrets,
      # and Dockerfile / compose misconfigurations. Skips .venv (it can
      # be left over from earlier steps in the shared workspace; trivy
      # would scan its bundled extractor files and flag false-positive
      # secrets that ship inside third-party packages like yt-dlp).
      - name: trivy fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-dirs: .venv,jobs
          skip-setup-trivy: true
      # Dedicated Dockerfile + compose static analysis (Trivy's IaC linter).
      - name: trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: build/
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-setup-trivy: true

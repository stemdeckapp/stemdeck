# The whole Playwright suite on big-release, the integration branch. A pull
# request into big-release runs only a scoped set (ci.yml), so this is where a
# spec outside that set shows up broken: within minutes of the merge that broke
# it, on that merge's commit. It never blocks a pull request.
#
# Triggers:
# - every push to big-release (each merged pull request);
# - nightly, on big-release;
# - by hand, on any branch: gh workflow run e2e-full.yml --repo stemdeckapp/stemdeck --ref <branch>
#   (or -f ref=<branch-or-sha> to test another ref with this branch's workflow).
#
# The schedule only fires from the default branch: GitHub reads this file, and
# the e2e.yml it calls, from main. Until this file reaches main there is no
# nightly run; pushes to big-release and manual runs work before that.

name: e2e-full

on:
  push:
    branches: [big-release]
  schedule:
    # 04:17 UTC, off the top of the hour when hosted runners are busiest.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to test (empty: the branch this was run on)"
        type: string
        default: ""

permissions: {}

# No concurrency group on purpose: a push to big-release, the nightly and a
# manual run are each a record of one commit, and none may cancel another.

jobs:
  full-suite:
    # Forks inherit the schedule; only this repository runs it.
    if: github.repository == 'stemdeckapp/stemdeck'
    uses: ./.github/workflows/e2e.yml
    with:
      mode: full
      # A scheduled run checks out the default branch (main) unless told
      # otherwise, so the nightly names big-release explicitly. A push tests
      # its own commit; a manual run tests the ref input, else its own branch.
      checkout-ref: ${{ github.event_name == 'schedule' && 'big-release' || inputs.ref || github.sha }}

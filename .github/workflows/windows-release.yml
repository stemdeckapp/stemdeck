name: Windows Release

on:
  # Pushing a version tag builds the installers into a draft release for that
  # tag (#1039). The draft is created if none exists; this workflow never
  # publishes it. Publishing is done by hand after testing, and it does not
  # rebuild Windows: there is no release trigger here any more. The filter is
  # the first narrowing; the tag job checks the same shape with a strict regex.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
  # Manual build (#1027): builds the commit this run is started on and uploads
  # to an existing draft with this tag. The guard job refuses any tag that is
  # not exactly one draft targeting that commit, so a published release can
  # never be overwritten from here.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing draft release, e.g. v0.21.0-rc.1"
        required: true
        type: string

permissions: {}

concurrency:
  # One group per tag: a tag push (github.ref is refs/tags/<tag>) and a manual
  # run for the same tag share it, so they queue instead of building side by
  # side. Nothing cancels a run in progress. GitHub keeps at most one run
  # waiting per group; a newer waiting run replaces an older waiting one.
  group: ${{ github.workflow }}-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-candidate-guard.yml
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
      allow_final_draft: true

  draft:
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-tag-draft.yml
    permissions:
      contents: write

  build-and-upload:
    needs: [guard, draft]
    # Exactly one of the two jobs runs; the build needs that one to pass.
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.draft.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.guard.result == 'success')
      ) }}
    # Runner must be windows/x64 with PowerShell, Docker, and rustup.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90
    permissions:
      contents: write
    # The release this run builds into, from the job that validated it: the
    # pushed tag (github.ref_name, checked by the draft job) or the manual
    # run's tag input (checked by the guard). These are the only places the
    # tag is chosen. If the job set nothing, the values are empty and the
    # version step and the pre-upload check stop the build. The github context
    # is evaluated by Actions, so this also works on runners older than 2.290,
    # which do not inject $env:GITHUB_REF_NAME (#212 follow-up).
    env:
      REF_NAME: ${{ github.event_name == 'push' && needs.draft.outputs.tag || needs.guard.outputs.tag }}
      RELEASE_ID: ${{ github.event_name == 'push' && needs.draft.outputs.release_id || needs.guard.outputs.release_id }}
      RELEASE_PRERELEASE: ${{ github.event_name == 'push' && needs.draft.outputs.prerelease || needs.guard.outputs.prerelease }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: clean workspace
        run: |
          Remove-Item -Recurse -Force .build, dist -ErrorAction SilentlyContinue

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: write version files
        run: |
          $tag = $env:REF_NAME
          if (-not $tag) { throw "REF_NAME is not set" }
          $version = $tag -replace '^v', ''
          $json = "{`"version`": `"$version`"}"
          Set-Content -Path "static/version.json" -Value $json -Encoding UTF8
          (Get-Content "desktop/src-tauri/Cargo.toml") -replace '^version = ".*"', "version = `"$version`"" |
            Set-Content "desktop/src-tauri/Cargo.toml"
          (Get-Content "desktop/src-tauri/tauri.conf.json") -replace '"version": "[^"]*"', "`"version`": `"$version`"" |
            Set-Content "desktop/src-tauri/tauri.conf.json"
          (Get-Content "desktop/package.json") -replace '"version": "[^"]*"', "`"version`": `"$version`"" |
            Set-Content "desktop/package.json"
          Write-Host "Wrote version $version to all version files"

      - name: build Windows NVIDIA
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/make-portable.ps1 `
            -PackageName StemDeck-Windows-x64.NVIDIA `
            -PackageVersion "$env:REF_NAME"

      - name: build Windows CPU
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/make-portable.ps1 `
            -PackageName StemDeck-Windows-x64 `
            -PackageVersion "$env:REF_NAME" `
            -CpuOnly `
            -PublishUpdaterAssets

      - name: scan artifacts
        run: |
          Write-Host "Preparing ClamAV scan for Windows release artifacts..."
          Write-Host "Artifacts staged in: $PWD\dist"
          Get-ChildItem -Path "dist" -File |
            Sort-Object Name |
            Select-Object Name,
              @{Name="SizeMB"; Expression={ [math]::Round($_.Length / 1MB, 2) }} |
            Format-Table -AutoSize

          Write-Host "SHA256 checksums:"
          Get-ChildItem -Path "dist" -Filter "*.zip" -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 $_.FullName
              Write-Host "  $($hash.Hash)  $($_.Name)"
            }

          Write-Host "Pulling latest ClamAV scanner image..."
          docker pull clamav/clamav:latest

          Write-Host "Running ClamAV scan over dist/..."
          docker run --rm -v "${PWD}/dist:/scan:ro" clamav/clamav:latest `
            clamscan --recursive --infected --bell /scan
          if ($LASTEXITCODE -ne 0) {
            throw "ClamAV scan failed or reported infected files. Exit code: $LASTEXITCODE"
          }
          Write-Host "ClamAV scan completed successfully. No infected files reported."

      # See the same guard in linux-release.yml: action-gh-release silently
      # tolerates missing files, so an absent updater asset shipped a green
      # release the in-app updater could not use.
      - name: verify every asset exists
        shell: powershell
        run: |
          $required = @(
            "dist/StemDeck-Windows-x64.NVIDIA.zip",
            "dist/StemDeck-Windows-x64.NVIDIA.zip.sha256",
            "dist/StemDeck-Windows-x64.zip",
            "dist/StemDeck-Windows-x64.zip.sha256",
            "dist/StemDeck-Windows-x64-app.zip",
            "dist/StemDeck-Windows-x64-app.zip.sha256",
            "dist/StemDeck-Windows-x64-runtime-version.json"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { Write-Error "missing release asset: $f"; exit 1 }
          }

      # The guard or draft job ran once, at the start of this run, and "Re-run
      # failed jobs" reuses its result. Check again on every attempt, for a tag
      # push and a manual run alike, right before the upload, that the release
      # is still a draft with the validated tag and pre-release flag, pointing
      # at the commit this run built. Without this, a re-run after publishing
      # would overwrite the published assets, and a re-run of an older run
      # would overwrite a retargeted draft's newer ones.
      - name: check the release is still the guarded draft
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.REF_NAME }}
          RUN_SHA: ${{ github.sha }}
        run: |
          if ($env:RELEASE_ID -notmatch '^[0-9]+$' -or -not $env:TAG -or $env:RUN_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:RELEASE_PRERELEASE -cnotmatch '^(true|false)$') {
            throw "Refusing to upload: the guard set no release id, tag or pre-release flag, or the run has no commit SHA."
          }
          $wantPrerelease = $env:RELEASE_PRERELEASE -ceq 'true'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $headers = @{
            "Authorization"        = "Bearer $env:GH_TOKEN"
            "Accept"               = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          function Get-Api([string]$Path) {
            Invoke-RestMethod -Method Get -Uri "$env:API_URL/repos/$env:REPO/$Path" -Headers $headers
          }
          # A JSON object arrives as a PSCustomObject; an array, a string or a
          # number does not, and a field of the wrong type is refused as well.
          $objectType = [System.Management.Automation.PSCustomObject]

          $release = Get-Api "releases/$env:RELEASE_ID"
          if ($release -isnot $objectType -or
              $release.tag_name -isnot [string] -or
              $release.draft -isnot [bool] -or
              $release.prerelease -isnot [bool] -or
              $release.target_commitish -isnot [string]) {
            throw "Refusing to upload: release $($env:RELEASE_ID) did not come back as a release object."
          }
          Write-Host "Release $($env:RELEASE_ID): tag=$($release.tag_name) draft=$($release.draft) prerelease=$($release.prerelease) target_commitish=$($release.target_commitish)"
          if ($release.tag_name -cne $env:TAG) {
            throw "Refusing to upload: release $($env:RELEASE_ID) now has the tag $($release.tag_name), not $($env:TAG)."
          }
          if ($release.draft -ne $true) {
            throw "Refusing to upload: release $($env:TAG) is no longer a draft; its own release build owns its assets."
          }
          if ($release.prerelease -ne $wantPrerelease) {
            throw "Refusing to upload: the pre-release flag of $($env:TAG) changed to $($release.prerelease) after the guard read $($env:RELEASE_PRERELEASE). Start a new run."
          }

          # The guard's commit check, repeated: an existing tag's commit,
          # otherwise the draft's target, must be the commit this run built.
          # Windows PowerShell 5.1 returns a JSON array as one Object[] value.
          $refs = Get-Api "git/matching-refs/tags/$env:TAG"
          if ($null -ne $refs -and $refs -isnot [array]) {
            throw "Refusing to upload: the tag lookup for $($env:TAG) did not come back as a list."
          }
          $exact = @(@($refs) | Where-Object { $_ -is $objectType -and $_.ref -ceq "refs/tags/$($env:TAG)" })
          if ($exact.Count -gt 0) {
            $commit = Get-Api "commits/refs/tags/$env:TAG"
            if ($commit -isnot $objectType -or $commit.sha -isnot [string]) {
              throw "Refusing to upload: the tag $($env:TAG) did not resolve to a commit."
            }
            $expected = $commit.sha
            $source = "existing tag $($env:TAG)"
          } else {
            $expected = $release.target_commitish
            $source = "target_commitish"
          }
          Write-Host "Commit this run built: $($env:RUN_SHA)"
          Write-Host "Commit the release points at ($source): $expected"
          if ($expected -cne $env:RUN_SHA) {
            throw "Refusing to upload: this run built $($env:RUN_SHA) but $($env:TAG) now points at $expected ($source). Start a new run instead of re-running this one."
          }
          Write-Host "Decision: UPLOAD to draft $($env:TAG) (release $($env:RELEASE_ID))."

      - name: upload artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          # Carry the release's own flag. The action defaults `prerelease` to
          # false and writes it back, so attaching assets silently promoted a
          # pre-release to the latest release -- which also fires `released`,
          # pushing :latest to GHCR, and makes the in-app updater offer a build
          # that was never verified.
          # Here that is the flag the guard or draft job read, which the check
          # above confirmed is unchanged.
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          # Upload to the draft named by the validated tag. Without draft: true
          # the action publishes the draft after uploading.
          tag_name: ${{ env.REF_NAME }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/StemDeck-Windows-x64.NVIDIA.zip
            dist/StemDeck-Windows-x64.NVIDIA.zip.sha256
            dist/StemDeck-Windows-x64.zip
            dist/StemDeck-Windows-x64.zip.sha256
            dist/StemDeck-Windows-x64-app.zip
            dist/StemDeck-Windows-x64-app.zip.sha256
            dist/StemDeck-Windows-x64-runtime-version.json

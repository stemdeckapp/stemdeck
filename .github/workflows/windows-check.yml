name: Windows Rust Check

# Manual, plus PRs that touch the Rust (see below). Companion to macos-check.yml: ci.yml (which
# does run on every PR) is 100% ubuntu-latest, so nothing behind
# #[cfg(windows)] -- or, as it turned out, code that lost a #[cfg(unix)] gate
# and started compiling on Windows by accident -- has ever had a real
# compiler pass before merging. That exact gap shipped a broken Windows
# build in v0.11.1's first release attempt.
on:
  workflow_dispatch:
  # Also on PRs that actually touch the Rust, so a desktop-shell change cannot
  # merge without a real compiler pass on this platform. Scoped by path so the
  # majority of PRs, which do not go near src-tauri, skip it. (#421 added ~600 lines of mostly cfg-gated Rust and every
  # CI check passed without compiling any of it.)
  pull_request:
    paths:
      - "desktop/src-tauri/**"
      - ".github/workflows/windows-check.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Fork PRs get a maintainer-triggered workflow_dispatch run instead. This
    # runner is GitHub-hosted and disposable, so the guard is no longer needed
    # for safety; it is kept so fork PRs do not start compiles on their own.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # windows-latest ships rustup and the MSVC toolchain. This intentionally
    # does not replace windows-release.yml -- this only builds/checks, never
    # packages or uploads anything.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # Kept as powershell: it is the shell this job has always run under
        # (bash mangled the temp script's Windows path on the old runner).
        shell: powershell
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo build
        run: cargo build --tests

      - name: cargo clippy
        # -A flags suppress pre-existing lints unrelated to this workflow's
        # purpose (tracked separately, not introduced by whatever change this
        # check is run against) so a real regression isn't lost in known noise.
        # unused_variables (pip_pid) and needless_return are Windows-build-only
        # findings from this workflow's first-ever run -- nothing has
        # type-checked this target before, so they predate this workflow
        # rather than being caused by it.
        run: >
          cargo clippy --tests -- -D warnings
          -A clippy::derivable_impls
          -A clippy::single_match
          -A clippy::trim_split_whitespace
          -A unused_variables
          -A clippy::needless_return

      - name: cargo test
        run: cargo test

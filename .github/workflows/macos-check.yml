name: macOS Rust Check

# Manual, plus PRs that touch the Rust (see below). Exists because ci.yml (which does run on
# every PR) is 100% ubuntu-latest, and a Linux runner cannot type-check code
# behind #[cfg(target_os = "macos")] at all -- that code is stripped before
# semantic analysis even starts, not just skipped at test time. This is the
# only way to get a real compiler pass over it before merging.
on:
  workflow_dispatch:
  # Also on PRs that actually touch the Rust, so a desktop-shell change cannot
  # merge without a real compiler pass on this platform. Scoped by path so the
  # majority of PRs, which do not go near src-tauri, skip it. (#421 added ~600 lines of mostly cfg-gated Rust and every
  # CI check passed without compiling any of it.)
  pull_request:
    paths:
      - "desktop/src-tauri/**"
      - ".github/workflows/macos-check.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Fork PRs get a maintainer-triggered workflow_dispatch run instead. This
    # runner is GitHub-hosted and disposable, so the guard is no longer needed
    # for safety; it is kept so fork PRs do not start compiles on their own.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # macos-latest is Apple Silicon (arm64) and ships Xcode CLT and rustup. This
    # intentionally does not replace macos-release.yml -- this only builds/checks,
    # never signs, packages, or uploads anything.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Compiled dependencies are most of this job's time. Keyed on Cargo.lock, so a
      # dependency change starts a fresh cache and the closest older one seeds it.
      - name: cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo build
        run: cargo build

      - name: cargo clippy
        # -A flags suppress pre-existing lints unrelated to this workflow's
        # purpose (tracked separately, not introduced by whatever change this
        # check is run against) so a real regression isn't lost in known noise.
        # unused_variables/dead_code (ensure_torch_device, classify_cuda_install_error,
        # child_output_with_timeout) are macOS-build-only findings from this
        # workflow's first-ever run -- nothing has type-checked this target
        # before, so they predate this workflow rather than being caused by it.
        run: |
          cargo clippy -- -D warnings \
            -A clippy::derivable_impls \
            -A clippy::single_match \
            -A clippy::trim_split_whitespace \
            -A unused_variables \
            -A dead_code

      - name: cargo test
        run: cargo test

name: macOS Release

on:
  # Pushing a version tag builds the installers into a draft release for that
  # tag (#1039). The draft is created if none exists; this workflow never
  # publishes it. Publishing is done by hand after testing, and it does not
  # rebuild macOS: there is no release trigger here any more. The filter is
  # the first narrowing; the tag job checks the same shape with a strict regex.
  # The signing check below still refuses to build without every secret.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
  # Manual build (#1027): builds the commit this run is started on and uploads
  # to an existing draft with this tag. The guard job refuses any tag that is
  # not exactly one draft targeting that commit, so a published release can
  # never be overwritten from here.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing draft release, e.g. v0.21.0-rc.1"
        required: true
        type: string

permissions: {}

concurrency:
  # One group per tag: a tag push (github.ref is refs/tags/<tag>) and a manual
  # run for the same tag share it, so they queue instead of building side by
  # side. Nothing cancels a run in progress. GitHub keeps at most one run
  # waiting per group; a newer waiting run replaces an older waiting one.
  group: ${{ github.workflow }}-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-candidate-guard.yml
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
      allow_final_draft: true

  draft:
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-tag-draft.yml
    permissions:
      contents: write

  build-and-upload:
    needs: [guard, draft]
    # Exactly one of the two jobs runs; the build needs that one to pass.
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.draft.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.guard.result == 'success')
      ) }}
    # Runner must be darwin/arm64 with Rosetta 2, Xcode CLT, Homebrew, rustup, and zstd.
    runs-on: [self-hosted, macOS, ARM64]
    # Four notarizations (app and DMG, for arm64 and x64) can each be slow.
    timeout-minutes: 360
    permissions:
      contents: write
    # The release this run builds into, from the job that validated it: the
    # pushed tag (github.ref_name, checked by the draft job) or the manual
    # run's tag input (checked by the guard). These are the only places the
    # tag is chosen. If the job set nothing, the values are empty and the
    # version step and the pre-upload check stop the build. The github context
    # is evaluated by Actions, so this also works on runners older than 2.290,
    # which do not inject $GITHUB_REF_NAME.
    env:
      REF_NAME: ${{ github.event_name == 'push' && needs.draft.outputs.tag || needs.guard.outputs.tag }}
      RELEASE_ID: ${{ github.event_name == 'push' && needs.draft.outputs.release_id || needs.guard.outputs.release_id }}
      RELEASE_PRERELEASE: ${{ github.event_name == 'push' && needs.draft.outputs.prerelease || needs.guard.outputs.prerelease }}
    defaults:
      run:
        shell: bash
    steps:
      - name: clean workspace
        run: rm -rf .build dist

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: write version files
        # REF_NAME comes from the job env above; empty stops this step.
        run: |
          if [ -z "${REF_NAME:-}" ]; then
            echo "REF_NAME is not set" >&2
            exit 1
          fi
          VERSION="${REF_NAME#v}"
          printf '{ "version": "%s" }\n' "$VERSION" > static/version.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" desktop/src-tauri/Cargo.toml
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" desktop/src-tauri/tauri.conf.json
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" desktop/package.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Wrote version $VERSION to all version files"

      # A release must never ship unsigned (#857): stop here if any signing or
      # notarization secret is missing, before spending an hour on the build.
      - name: prepare signing credentials
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name is empty. Refusing to build an unsigned macOS release."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          identities="$(security find-identity -v -p codesigning)"
          if ! grep -qF "$APPLE_SIGNING_IDENTITY" <<<"$identities"; then
            echo "::error::The signing identity is not in this runner's keychain."
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path")
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: build macOS arm64
        env:
          SSL_CERT_FILE: /etc/ssl/cert.pem
          REQUESTS_CA_BUNDLE: /etc/ssl/cert.pem
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          command -v zstd
          command -v uv >/dev/null 2>&1 || brew install uv
          uv python install cpython-3.12-macos-aarch64-none
          ARM64_PYTHON="$(uv python find cpython-3.12-macos-aarch64-none)"
          scripts/macos/make-iconset.sh
          ARCH=arm64 VERSION="$VERSION" PYTHON_BIN="$ARM64_PYTHON" scripts/macos/make-runtime-pack.sh
          ARCH=arm64 VERSION="$VERSION" scripts/macos/make-app.sh
          ARCH=arm64 VERSION="$VERSION" scripts/macos/make-dmg.sh

      - name: build macOS x64
        env:
          SSL_CERT_FILE: /etc/ssl/cert.pem
          REQUESTS_CA_BUNDLE: /etc/ssl/cert.pem
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          command -v zstd
          if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            echo "ERROR: Rosetta 2 is required to build the x64 runtime on this agent." >&2
            exit 1
          fi
          rustup default stable
          rustup target add x86_64-apple-darwin
          command -v uv >/dev/null 2>&1 || brew install uv
          uv python install cpython-3.12-macos-x86_64-none
          X64_PYTHON="$(uv python find cpython-3.12-macos-x86_64-none)"
          ARCH=x64 VERSION="$VERSION" PYTHON_BIN="$X64_PYTHON" scripts/macos/make-runtime-pack.sh
          ARCH=x64 VERSION="$VERSION" scripts/macos/make-app.sh
          ARCH=x64 VERSION="$VERSION" scripts/macos/make-dmg.sh

      - name: inspect artifacts
        run: |
          test -f .build/macos-dist/StemDeck-macOS-arm64.dmg
          test -f .build/StemDeck-runtime-macOS-arm64.tar.zst
          test -f .build/macos-dist/SHA256SUMS-macOS-arm64.txt
          test -f .build/macos-dist/StemDeck-macOS-x64.dmg
          test -f .build/StemDeck-runtime-macOS-x64.tar.zst
          test -f .build/macos-dist/SHA256SUMS-macOS-x64.txt
          cat .build/macos-dist/SHA256SUMS-macOS-arm64.txt
          cat .build/macos-dist/SHA256SUMS-macOS-x64.txt
          du -sh .build/macos-dist/StemDeck-macOS-arm64.dmg .build/StemDeck-runtime-macOS-arm64.tar.zst
          du -sh .build/macos-dist/StemDeck-macOS-x64.dmg .build/StemDeck-runtime-macOS-x64.tar.zst
          if find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/StemDeck.app \
            \( -iname '*python*' -o -iname '*torch*' -o -iname '*ffmpeg*' -o -iname '*ffprobe*' \) |
            grep -q .; then
            echo "arm64 StemDeck.app contains runtime binaries that should stay outside the DMG." >&2
            exit 1
          fi
          if find desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/StemDeck.app \
            \( -iname '*python*' -o -iname '*torch*' -o -iname '*ffmpeg*' -o -iname '*ffprobe*' \) |
            grep -q .; then
            echo "x64 StemDeck.app contains runtime binaries that should stay outside the DMG." >&2
            exit 1
          fi
          for arch in arm64 x64; do
            mountpoint="$(mktemp -d /tmp/stemdeck-dmg.XXXXXX)"
            hdiutil attach ".build/macos-dist/StemDeck-macOS-$arch.dmg" -readonly -nobrowse -mountpoint "$mountpoint"
            trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true; rmdir "$mountpoint" >/dev/null 2>&1 || true' EXIT
            test -d "$mountpoint/StemDeck.app"
            test -L "$mountpoint/Applications"
            test -f "$mountpoint/README-macOS.txt"
            test -f "$mountpoint/THIRD_PARTY_NOTICES.txt"
            # Gatekeeper gate (#857): the shipped app must be sealed, notarized
            # and stapled, and so must the DMG around it.
            codesign --verify --deep --strict --verbose=2 "$mountpoint/StemDeck.app"
            assessment="$(spctl -a -vvv -t exec "$mountpoint/StemDeck.app" 2>&1)" || true
            echo "$assessment"
            if ! grep -q ': accepted' <<<"$assessment" ||
              ! grep -q 'source=Notarized Developer ID' <<<"$assessment"; then
              echo "$arch StemDeck.app is not accepted as a notarized Developer ID app." >&2
              exit 1
            fi
            xcrun stapler validate "$mountpoint/StemDeck.app"
            hdiutil detach "$mountpoint"
            rmdir "$mountpoint"
            trap - EXIT
            xcrun stapler validate ".build/macos-dist/StemDeck-macOS-$arch.dmg"
          done

      # The guard or draft job ran once, at the start of this run, and "Re-run
      # failed jobs" reuses its result. Check again on every attempt, for a tag
      # push and a manual run alike, right before the upload, that the release
      # is still a draft with the validated tag and pre-release flag, pointing
      # at the commit this run built. Without this, a re-run after publishing
      # would overwrite the published assets, and a re-run of an older run
      # would overwrite a retargeted draft's newer ones.
      - name: check the release is still the guarded draft
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.REF_NAME }}
          RUN_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          // Throw rather than process.exit(): exiting with a fetch socket still
          // open aborts Node on Windows. The catch below sets the exit code.
          const stop = (why) => {
            throw new Error(why);
          };
          const isObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
          (async () => {
            const { GH_TOKEN, API_URL, REPO, RELEASE_ID, TAG, RUN_SHA, RELEASE_PRERELEASE } = process.env;
            if (
              !/^[0-9]+$/.test(RELEASE_ID || '') ||
              !TAG ||
              !/^[0-9a-f]{40}$/.test(RUN_SHA || '') ||
              !/^(true|false)$/.test(RELEASE_PRERELEASE || '')
            ) {
              stop('the guard set no release id, tag or pre-release flag, or the run has no commit SHA.');
            }
            const wantPrerelease = RELEASE_PRERELEASE === 'true';
            if (typeof fetch !== 'function') stop('this check needs Node.js 18 or newer on the runner.');
            const get = async (path) => {
              const res = await fetch(`${API_URL}/repos/${REPO}/${path}`, {
                headers: {
                  Authorization: `Bearer ${GH_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              });
              if (!res.ok) stop(`${path} could not be read (HTTP ${res.status}).`);
              return res.json();
            };

            const rel = await get(`releases/${RELEASE_ID}`);
            if (
              !isObject(rel) ||
              typeof rel.tag_name !== 'string' ||
              typeof rel.draft !== 'boolean' ||
              typeof rel.prerelease !== 'boolean' ||
              typeof rel.target_commitish !== 'string'
            ) {
              stop(`release ${RELEASE_ID} did not come back as a release object.`);
            }
            console.log(
              `Release ${RELEASE_ID}: tag=${rel.tag_name} draft=${rel.draft} prerelease=${rel.prerelease} target_commitish=${rel.target_commitish}`,
            );
            if (rel.tag_name !== TAG) stop(`release ${RELEASE_ID} now has the tag ${rel.tag_name}, not ${TAG}.`);
            if (rel.draft !== true) stop(`release ${TAG} is no longer a draft; its own release build owns its assets.`);
            if (rel.prerelease !== wantPrerelease) {
              stop(`the pre-release flag of ${TAG} changed to ${rel.prerelease} after the guard read ${RELEASE_PRERELEASE}. Start a new run.`);
            }

            // The guard's commit check, repeated: an existing tag's commit,
            // otherwise the draft's target, must be the commit this run built.
            const refs = await get(`git/matching-refs/tags/${TAG}`);
            if (!Array.isArray(refs)) stop(`the tag lookup for ${TAG} did not come back as a list.`);
            let expected;
            let source;
            if (refs.some((r) => isObject(r) && r.ref === `refs/tags/${TAG}`)) {
              const commit = await get(`commits/refs/tags/${TAG}`);
              if (!isObject(commit) || typeof commit.sha !== 'string') stop(`the tag ${TAG} did not resolve to a commit.`);
              expected = commit.sha;
              source = `existing tag ${TAG}`;
            } else {
              expected = rel.target_commitish;
              source = 'target_commitish';
            }
            console.log(`Commit this run built: ${RUN_SHA}`);
            console.log(`Commit the release points at (${source}): ${expected}`);
            if (expected !== RUN_SHA) {
              stop(`this run built ${RUN_SHA} but ${TAG} now points at ${expected} (${source}). Start a new run instead of re-running this one.`);
            }
            console.log(`Decision: UPLOAD to draft ${TAG} (release ${RELEASE_ID}).`);
          })().catch((err) => {
            console.log(`::error::Refusing to upload: ${err.message}`);
            process.exitCode = 1;
          });
          NODE

      - name: upload artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          # Carry the release's own flag. The action defaults `prerelease` to
          # false and writes it back, so attaching assets silently promoted a
          # pre-release to the latest release -- which also fires `released`,
          # pushing :latest to GHCR, and makes the in-app updater offer a build
          # that was never verified.
          # Here that is the flag the guard or draft job read, which the check
          # above confirmed is unchanged.
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          # Upload to the draft named by the validated tag. Without draft: true
          # the action publishes the draft after uploading.
          tag_name: ${{ env.REF_NAME }}
          draft: true
          files: |
            .build/macos-dist/StemDeck-macOS-arm64.dmg
            .build/StemDeck-runtime-macOS-arm64.tar.zst
            .build/macos-dist/SHA256SUMS-macOS-arm64.txt
            .build/macos-dist/StemDeck-macOS-x64.dmg
            .build/StemDeck-runtime-macOS-x64.tar.zst
            .build/macos-dist/SHA256SUMS-macOS-x64.txt

      - name: remove signing credentials
        if: always()
        run: |
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

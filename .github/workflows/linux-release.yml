name: Linux Release

on:
  release:
    types: [published]
  # Release candidate build (#1027): builds the commit this run is started on
  # and uploads to an existing draft pre-release with this tag. The guard job
  # refuses any tag that is not exactly one draft pre-release targeting that
  # commit, so a published release can never be overwritten from here.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing draft pre-release, e.g. v0.21.0-rc.1"
        required: true
        type: string

permissions: {}

concurrency:
  # A manual run shares the group of the release it builds into. Only a
  # release event cancels what is in progress: publishing a draft cancels a
  # candidate build still running for it, while a manual run never cancels a
  # release build. The group comes from the raw input and applies before the
  # guard, so a manual run typed with a published tag waits behind that
  # release's build, and its guard then refuses. On a release event inputs.tag
  # is empty and the group is the same as before.
  group: ${{ github.workflow }}-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'release' }}

jobs:
  guard:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-candidate-guard.yml
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}

  build-and-upload:
    needs: guard
    # A release event skips the guard; a manual run builds only if it passed.
    if: ${{ !cancelled() && (github.event_name == 'release' || needs.guard.result == 'success') }}
    # Runner must be linux/x64 with rustup, Node.js, Docker, and sudo apt access.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: clean workspace
        run: rm -rf .build dist

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Tauri v2 build deps + tooling. webkit2gtk-4.1 matches the tauri = "2"
          # crate; ffmpeg is a runtime dependency, not bundled.
          #
          # The self-hosted runner does NOT have passwordless sudo, so a bare
          # `sudo apt-get` hangs forever at the password prompt. These packages are
          # already installed on the persistent runner, so check first (dpkg needs
          # no sudo) and skip apt entirely when everything is present. Only if a
          # package is genuinely missing do we touch apt, via `sudo -n` (fails fast
          # instead of prompting) so a release never hangs on sudo again.
          PKGS="build-essential curl file wget libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev"
          missing=""
          for p in $PKGS; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -z "$missing" ]; then
            echo "All build dependencies already installed; skipping apt."
            exit 0
          fi
          echo "Missing packages:$missing"
          if ! sudo -n true 2>/dev/null; then
            echo "ERROR: build deps missing and passwordless sudo is not available." >&2
            echo "Install on the runner:  sudo apt-get install -y$missing" >&2
            exit 1
          fi
          sudo -n apt-get update -o DPkg::Lock::Timeout=120
          sudo -n apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=120 $missing

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: install rust toolchain
        run: rustup default stable

      - name: write version files
        env:
          # github.ref_name (evaluated by Actions) instead of $GITHUB_REF_NAME,
          # which is only injected by runner >= 2.290, so it is empty on older
          # self-hosted runners. A manual run takes the tag the guard
          # validated; if the guard set nothing it is empty and this step stops.
          REF_NAME: ${{ github.event_name == 'release' && github.ref_name || needs.guard.outputs.tag }}
        run: |
          VERSION="${REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "Could not determine a version" >&2
            exit 1
          fi
          printf '{ "version": "%s" }\n' "$VERSION" > static/version.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" desktop/src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" desktop/src-tauri/tauri.conf.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" desktop/package.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Wrote version $VERSION to all version files"

      - name: build Linux CPU
        run: |
          # PUBLISH_UPDATER_ASSETS=1 also emits the slim app-layer asset the
          # in-app updater downloads (#421). Built once here: StemDeck and
          # backend/ are identical in both variants.
          PACKAGE_NAME=StemDeck-Linux-x64 \
          PACKAGE_VERSION="$VERSION" \
          PUBLISH_UPDATER_ASSETS=1 \
            bash scripts/linux/make-portable.sh
          # Drop the uncompressed stage but keep the tarball; frees disk for the
          # larger NVIDIA build. The Tauri binary under target/ is preserved.
          rm -rf dist/StemDeck-Linux-x64

      - name: build Linux NVIDIA
        run: |
          # CPU_ONLY=0 keeps the CUDA torch wheel; SKIP_TAURI_BUILD=1 reuses the
          # binary built in the CPU step (identical for both variants).
          PACKAGE_NAME=StemDeck-Linux-x64.NVIDIA \
          PACKAGE_VERSION="$VERSION" \
          CPU_ONLY=0 \
          SKIP_TAURI_BUILD=1 \
            bash scripts/linux/make-portable.sh
          rm -rf dist/StemDeck-Linux-x64.NVIDIA

      - name: scan artifacts
        run: |
          echo "Artifacts staged in: $PWD/dist"
          ls -lh dist
          echo "SHA256 checksums:"
          ( cd dist && sha256sum *.tar.gz )

          echo "Pulling latest ClamAV scanner image..."
          docker pull clamav/clamav:latest

          echo "Running ClamAV scan over dist/..."
          docker run --rm -v "$PWD/dist:/scan:ro" clamav/clamav:latest \
            clamscan --recursive --infected --bell /scan
          echo "ClamAV scan completed successfully. No infected files reported."

      # macos-release.yml asserts its assets exist before uploading; this did
      # not. action-gh-release defaults fail_on_unmatched_files to false, so a
      # missing updater asset published a release that looked fine and went
      # green, and the in-app updater then 404'd for every installed user.
      - name: verify every asset exists
        run: |
          for f in \
            dist/StemDeck-Linux-x64.tar.gz \
            dist/StemDeck-Linux-x64.tar.gz.sha256 \
            dist/StemDeck-Linux-x64.NVIDIA.tar.gz \
            dist/StemDeck-Linux-x64.NVIDIA.tar.gz.sha256 \
            dist/StemDeck-Linux-x64-app.tar.gz \
            dist/StemDeck-Linux-x64-app.tar.gz.sha256 \
            dist/StemDeck-Linux-x64-runtime-version.json; do
            test -f "$f" || { echo "missing release asset: $f" >&2; exit 1; }
          done

      # The guard ran once, at the start of this run, and "Re-run failed jobs"
      # reuses its result. Check again on every attempt, right before the
      # upload, that the guarded release is still a draft pre-release with the
      # guarded tag, pointing at the commit this run built. Without this, a
      # re-run after publishing would overwrite the published assets, and a
      # re-run of an older run would overwrite a retargeted draft's newer ones.
      - name: check the release is still the guarded draft
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.guard.outputs.release_id }}
          TAG: ${{ needs.guard.outputs.tag }}
          RUN_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          // Throw rather than process.exit(): exiting with a fetch socket still
          // open aborts Node on Windows. The catch below sets the exit code.
          const stop = (why) => {
            throw new Error(why);
          };
          const isObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
          (async () => {
            const { GH_TOKEN, API_URL, REPO, RELEASE_ID, TAG, RUN_SHA } = process.env;
            if (!/^[0-9]+$/.test(RELEASE_ID || '') || !TAG || !/^[0-9a-f]{40}$/.test(RUN_SHA || '')) {
              stop('the guard set no release id or tag, or the run has no commit SHA.');
            }
            if (typeof fetch !== 'function') stop('this check needs Node.js 18 or newer on the runner.');
            const get = async (path) => {
              const res = await fetch(`${API_URL}/repos/${REPO}/${path}`, {
                headers: {
                  Authorization: `Bearer ${GH_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              });
              if (!res.ok) stop(`${path} could not be read (HTTP ${res.status}).`);
              return res.json();
            };

            const rel = await get(`releases/${RELEASE_ID}`);
            if (
              !isObject(rel) ||
              typeof rel.tag_name !== 'string' ||
              typeof rel.draft !== 'boolean' ||
              typeof rel.prerelease !== 'boolean' ||
              typeof rel.target_commitish !== 'string'
            ) {
              stop(`release ${RELEASE_ID} did not come back as a release object.`);
            }
            console.log(
              `Release ${RELEASE_ID}: tag=${rel.tag_name} draft=${rel.draft} prerelease=${rel.prerelease} target_commitish=${rel.target_commitish}`,
            );
            if (rel.tag_name !== TAG) stop(`release ${RELEASE_ID} now has the tag ${rel.tag_name}, not ${TAG}.`);
            if (rel.draft !== true) stop(`release ${TAG} is no longer a draft; its own release build owns its assets.`);
            if (rel.prerelease !== true) stop(`release ${TAG} is no longer marked pre-release.`);

            // The guard's commit check, repeated: an existing tag's commit,
            // otherwise the draft's target, must be the commit this run built.
            const refs = await get(`git/matching-refs/tags/${TAG}`);
            if (!Array.isArray(refs)) stop(`the tag lookup for ${TAG} did not come back as a list.`);
            let expected;
            let source;
            if (refs.some((r) => isObject(r) && r.ref === `refs/tags/${TAG}`)) {
              const commit = await get(`commits/refs/tags/${TAG}`);
              if (!isObject(commit) || typeof commit.sha !== 'string') stop(`the tag ${TAG} did not resolve to a commit.`);
              expected = commit.sha;
              source = `existing tag ${TAG}`;
            } else {
              expected = rel.target_commitish;
              source = 'target_commitish';
            }
            console.log(`Commit this run built: ${RUN_SHA}`);
            console.log(`Commit the release points at (${source}): ${expected}`);
            if (expected !== RUN_SHA) {
              stop(`this run built ${RUN_SHA} but ${TAG} now points at ${expected} (${source}). Start a new run instead of re-running this one.`);
            }
            console.log(`Decision: UPLOAD to draft ${TAG} (release ${RELEASE_ID}).`);
          })().catch((err) => {
            console.log(`::error::Refusing to upload: ${err.message}`);
            process.exitCode = 1;
          });
          NODE

      - name: upload artifacts
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          # Carry the release's own flag. The action defaults `prerelease` to
          # false and writes it back, so attaching assets silently promoted a
          # pre-release to the latest release -- which also fires `released`,
          # pushing :latest to GHCR, and makes the in-app updater offer a build
          # that was never verified.
          prerelease: ${{ github.event.release.prerelease || github.event_name == 'workflow_dispatch' }}
          # A manual run uploads to the draft named by the guarded tag. Without
          # draft: true the action publishes the draft after uploading. On a
          # release event both are empty and the action keeps its defaults.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && needs.guard.outputs.tag || '' }}
          draft: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
          fail_on_unmatched_files: true
          files: |
            dist/StemDeck-Linux-x64.tar.gz
            dist/StemDeck-Linux-x64.tar.gz.sha256
            dist/StemDeck-Linux-x64.NVIDIA.tar.gz
            dist/StemDeck-Linux-x64.NVIDIA.tar.gz.sha256
            dist/StemDeck-Linux-x64-app.tar.gz
            dist/StemDeck-Linux-x64-app.tar.gz.sha256
            dist/StemDeck-Linux-x64-runtime-version.json
